# FRR "ToR" for the Kube-OVN lab — verified working config (FRR 9.1, 2026-10-27).
#
# Install:  apt-get install -y frr && sed -i 's/^bgpd=no/bgpd=yes/' /etc/frr/daemons
#           cp frr-tor.conf /etc/frr/frr.conf && chown frr:frr /etc/frr/frr.conf
#           systemctl restart frr
#
# CRITICAL: `no bgp ebgp-requires-policy`. FRR >= 7.4 requires an inbound/outbound
# policy for eBGP. Without this line the sessions come up, prefixes are dropped,
# `show bgp summary` prints "(Policy)" and `show bgp neighbor X` says
# "Inbound updates discarded due to missing policy" — a silent zero-route fabric.

frr version 8.4.4
frr defaults traditional
hostname kovn-tor
log syslog informational
service integrated-vtysh-config
!
router bgp 65100
 no bgp ebgp-requires-policy
 bgp router-id 192.168.1.113
 no bgp default ipv4-unicast
 neighbor 192.168.1.110 remote-as 65001
 neighbor 192.168.1.111 remote-as 65001
 neighbor 192.168.1.112 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 192.168.1.110 activate
  neighbor 192.168.1.111 activate
  neighbor 192.168.1.112 activate
 exit-address-family
 !
 ! For proposal 0002 (iBGP/RR): set all remote-as to 65001 and add
 ! "neighbor <ip> route-reflector-client" plus "bgp cluster-id 192.168.1.113".
 !
 ! For proposal 0001/0007 (EVPN): add
 !  address-family l2vpn evpn
 !   advertise-all-vni
 !   neighbor <ip> activate
 !  exit-address-family
 !
 ! For proposal 0005 (OSPF): add
 !  router ospf
 !   ospf router-id 192.168.1.113
 !   network 192.168.1.0/24 area 0.0.0.0
 !   redistribute connected
